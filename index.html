<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppLibrary — uesugiyuuto's iOS Apps</title>
  <meta name="description" content="Xcode で作った iOS アプリの紹介ライブラリ。">

  <!-- OGP -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AppLibrary">
  <meta property="og:title" content="AppLibrary">
  <meta property="og:description" content="Xcode で作った iOS アプリの紹介ライブラリ。">
  <!-- TODO: OGP 画像を assets/img/ogp.png として配置したら有効化 -->
  <!-- <meta property="og:image" content="./assets/img/ogp.png"> -->
  <meta name="twitter:card" content="summary_large_image">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Design System -->
  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/standard.css">

  <!-- FOUC 対策: 保存済みテーマ等を first paint 前に当てる + Hero opening 判定 -->
  <script>
    (function () {
      var html = document.documentElement;
      try {
        var s = JSON.parse(localStorage.getItem('applibrary_state') || 'null');
        if (s) {
          if (s.theme)   html.setAttribute('data-theme',   s.theme);
          if (s.layout)  html.setAttribute('data-layout',  s.layout);
          if (s.density) html.setAttribute('data-density', s.density);
          if (s.font)    html.setAttribute('data-font',    s.font);
          if (s.accent)  html.style.setProperty('--accent', s.accent);
        }
      } catch (_) { /* localStorage unavailable */ }

      try {
        var seen = sessionStorage.getItem('applibrary_hero_seen');
        var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (seen || prefersReducedMotion) {
          html.setAttribute('data-hero-opening', 'off');
        } else {
          html.setAttribute('data-hero-opening', 'play');
          sessionStorage.setItem('applibrary_hero_seen', '1');
        }
      } catch (_) {
        html.setAttribute('data-hero-opening', 'off');
      }
    })();
  </script>
</head>
<body>

  <!-- Liquid Glass SVG filter（必須） -->
  <script src="./assets/js/glass-filter.js"></script>

  <!-- SPA マウントポイント -->
  <div id="root"></div>
  <div id="modal-root"></div>
  <div id="tweaks-root"></div>

  <!-- Data + Renderer（順序重要：レジストリ→サイトデータ→メイン） -->
  <script src="./apps/registry.js"></script>
  <script src="./assets/js/site-data.js"></script>
  <script src="./assets/js/main.js"></script>

  <!-- TODO: Analytics を入れるときはここに 1 行追加（例: plausible / GA4） -->
</body>
</html>
