<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <title>404 — AppLibrary</title>
  <!--
    GitHub Pages はこのファイルを任意深さの 404 で返す。
    相対パスが効かない場合があるため、スタイルはインラインで自己完結させる。
  -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic UI', sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at top left,  rgba(90, 200, 250, 0.55), transparent 60%),
        radial-gradient(ellipse at bottom right, rgba(191, 90, 242, 0.55), transparent 60%),
        linear-gradient(135deg, #1a2a6c 0%, #2E3192 50%, #0f2027 100%);
      background-attachment: fixed;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .panel {
      max-width: 460px;
      padding: 40px 32px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }
    h1 { font-size: 64px; font-weight: 800; letter-spacing: -0.02em; }
    p  { margin-top: 12px; opacity: 0.85; }
    a  {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 24px;
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: linear-gradient(135deg, rgba(0, 122, 255, 0.6), rgba(90, 200, 250, 0.5));
      font-weight: 600;
    }
    a:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <div class="panel">
    <h1>404</h1>
    <p>お探しのページは見つかりませんでした。</p>
    <a href="/">トップに戻る</a>
  </div>
</body>
</html>
